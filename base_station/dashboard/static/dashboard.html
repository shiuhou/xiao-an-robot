<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xiao-An Work Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
  </head>
  <body>
    <main class="dashboard-shell">
      <section class="top-bar" aria-label="时间和模式">
        <div class="time-block">
          <div class="clock" id="clock">--:--</div>
          <div class="date-line" id="dateLine">---- -- --</div>
        </div>
        <div class="mode-chip" id="modeChip">待命</div>
      </section>

      <section class="todo-panel" aria-label="Todo List">
        <div class="panel-heading">
          <h1>Todo List</h1>
          <span id="todoCount">0 项</span>
        </div>
        <div class="todo-list" id="todoList"></div>
        <div class="more-line" id="todoMore"></div>
      </section>

      <section class="schedule-panel" aria-label="今日日程">
        <div class="panel-heading">
          <h1>今日日程</h1>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
      </section>

      <section class="bottom-panel" aria-label="下一件事和小安最近回复">
        <div class="next-line" id="nextLine">下一件事：暂无</div>
        <div class="reply-line" id="replyLine">小安正在待命。</div>
      </section>
    </main>

    <script src="/static/dashboard.js"></script>
  </body>
</html>
